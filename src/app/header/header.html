<!-- The app renders this header independently of the routed view. -->
<mat-toolbar class="main-header">
  <a matButton class="brand-link" routerLink="/products" aria-label="Modern Angular products">
    <mat-icon aria-hidden="true" fontIcon="store"></mat-icon>
    <span class="branding">Modern Angular</span>
  </a>

  <span class="spacer"></span>

  <nav class="main-nav" aria-label="Main navigation">
    <a matButton routerLink="/products" routerLinkActive="active-link" ariaCurrentWhenActive="page">
      Products
    </a>
    <a
      matButton
      routerLink="/cart"
      routerLinkActive="active-link"
      ariaCurrentWhenActive="page"
      [attr.aria-label]="'Cart, ' + cartService.totalItems() + ' items'"
    >
      <span
        class="cart-icon"
        [matBadge]="cartService.totalItems()"
        [matBadgeHidden]="cartService.totalItems() === 0"
      >
        <mat-icon aria-hidden="true" fontIcon="shopping_cart"></mat-icon>
      </span>
      <span class="cart-label">Cart</span>
    </a>
  </nav>
</mat-toolbar>
