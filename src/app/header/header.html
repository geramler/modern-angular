<!-- The app renders this header independently of the routed view. -->
<mat-toolbar class="main-header">
  <!-- matButton is a directive from Angular Material -->
  <button matButton>
    <mat-icon aria-hidden="false" aria-label="Home" fontIcon="store"></mat-icon>
   </button>

   <span class="branding">Modern Angular</span>

   <span class="spacer"></span>

   <button matButton>Products</button>

   <button matButton>
    <mat-icon
      [matBadge]="cartService.totalItems()"
      [matBadgeHidden]="cartService.totalItems() === 0"
      aria-hidden="false"
      aria-label="Cart"
      fontIcon="shopping_cart"
    ></mat-icon>
   </button>
</mat-toolbar>
