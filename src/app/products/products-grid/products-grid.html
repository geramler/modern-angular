<div class="products-container">

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search Products</mat-label>
    <!-- Initialize the input from searchTerm and write edits back to the signal. -->
    <input matInput [(ngModel)]="searchTerm" placeholder="e.g. headphones" />
  </mat-form-field>

  <div class="products-grid">
    <!-- Track by stable ID so Angular can preserve product views across list updates. -->
    @for (product of filteredProducts(); track product.id) {
      <!-- Pass the current product to the card and handle its addToCart output. -->
      <app-product-card [product]="product"
      (addToCart) = "onAddToCart($event)" />
    } @empty {
      <div class="empty-state">
        <mat-icon>inventory_2</mat-icon>
        <p>No products match your search</p>
      </div>
    }
  </div>
</div>
